# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

keymode=default

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,d,spawn,rofi -show drun
# bind=SUPER,g,spawn,rofi -show emoji
bind=SUPER,e,spawn,Thunar
bind=SUPER,Return,spawn,footclient
bind=SUPER,w,spawn,/home/utane/.config/mango/rebar.sh

# Invocación global de tmux sessionizer
bind=SUPER,t,spawn,~/.local/bin/tmux-sessionizer.sh
bind=SUPER,s,spawn,~/.local/bin/session-finder.sh
bind=SUPER,b,spawn,~/.local/bin/swbg.sh

# Mount android device
# bind=SUPER,m,spawn,aft-mtp-mount ~/Público/
bind=SUPER,u,spawn,umount ~/Público/

# exit
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,c,killclient,

# switch window focus
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right

# switch window status
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT,Tab,togglejump,
# bind=SUPER,g,toggleglobal,
# bind=SUPER,a,togglemaximizescreen,
# bind=SUPER+SHIFT,f,togglefakefullscreen,
# bind=SUPER+SHIFT,i,minimized,
# bind=SUPER+CTRL,I,restore_minimized
# bind=SUPER,o,toggleoverlay,
# bind=ALT,z,toggle_scratchpad

# Layouts
bind=SUPER,f,togglefloating
bind=SUPER+SHIFT,t,setlayout,tile
bind=SUPER,v,setlayout,vertical_grid
bind=SUPER,x,setlayout,scroller
bind=SUPER+SHIFT,m,setlayout,monocle
bind=SUPER+SHIFT,v,setlayout,vertical_scroller

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,h,scroller_stack,left
bind=alt+super+ctrl,l,scroller_stack,right
bind=alt+super+ctrl,k,scroller_stack,up
bind=alt+super+ctrl,j,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=SUPER+SHIFT,Tab,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=SUPER,TAB,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4
bind=SUPER,5,comboview,5
bind=SUPER,6,comboview,6
bind=SUPER,7,comboview,7
bind=SUPER,8,comboview,8
bind=SUPER,9,comboview,9

bind=SUPER,i,incnmaster,+1
bind=SUPER,p,incnmaster,-1

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+CTRL,1,tagsilent,1,0
bind=SUPER+CTRL,2,tagsilent,2,0
bind=SUPER+CTRL,3,tagsilent,3,0
bind=SUPER+CTRL,4,tagsilent,4,0
bind=SUPER+CTRL,5,tagsilent,5,0
bind=SUPER+CTRL,6,tagsilent,6,0
bind=SUPER+CTRL,7,tagsilent,7,0
bind=SUPER+CTRL,8,tagsilent,8,0
bind=SUPER+CTRL,9,tagsilent,9,0

# gaps
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,j,resizewin,+0,+50
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,l,resizewin,+50,+0

# applications

bind=SUPER+ALT,A,spawn,anki
bind=SUPER+ALT,B,spawn,firefox-bin
bind=SUPER+ALT,G,spawn,gimp
bind=SUPER+ALT,N,spawn,nicotine
bind=SUPER+ALT,T,spawn,transmission-gtk
bind=SUPER+ALT,F,spawn,filezilla
bind=SUPER+ALT,K,spawn,keepassxc
bind=SUPER+ALT,V,spawn,virt-manager
bind=SUPER+ALT,C,spawn,code
bind=SUPER+ALT,O,spawn,obs
bind=SUPER+ALT,M,spawn,footclient -e ncmpcpp
bind=SUPER+ALT,H,spawn,footclient -e htop

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# brightnessc
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -q -e set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -q -e set 10%-
bind=NONE,XF86Calculator,spawn,rofi -show calc -no-show-match -no-sort

# volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.3 @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCEK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# playback
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Manejar dunst

# close topmost notification
bind=CTRL+SHIFT,SPACE,spawn,dunstctl close

# close all notifications currently being dis
bind=CTRL+ALT,SPACE,spawn,dunstctl close-all

bind=CTRL,period,spawn,dunstctl history-pop

# Utility

# Screenshot keybindings NOTE: You may need to press Fn key as well
bind=NONE,Print,spawn,~/.local/bin/screenshot.sh

bind=SUPER+ALT,l,spawn,swaylock -f

bind=SUPER+ALT,d,spawn,~/.local/bin/dencript.sh

# bind=SUPER,Escape,setkeymode,passthru

