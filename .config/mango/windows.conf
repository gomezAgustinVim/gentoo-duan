# Fix XWayland Drags / Menus / Popups
windowrule=appid:^$,title:^$,isfloating:1,isopensilent:1

# ------------------------------------------------------------------------------
# TAG ASSIGNMENTS & SILENT LAUNCHES (WORKSPACES)
# ------------------------------------------------------------------------------

# Workspace 1
windowrule=appid:firefox,tags:1,isopensilent:1

# Workspace 3
windowrule=appid:librewolf,tags:3,isopensilent:1
windowrule=appid:discord,tags:3,isopensilent:1
windowrule=title:^[sS]team,tags:3,isopensilent:1

# Workspace 4
windowrule=appid:code-oss,tags:4,isopensilent:1
windowrule=appid:anki,tags:4
windowrule=appid:^([Vv]irt.*),tags:4,isopensilent:1

# Workspace 5
windowrule=appid:.*(KeePassXC)$,tags:5

# Workspace 6
windowrule=appid:gimp,tags:6,isopensilent:1
windowrule=appid:filezilla,tags:6,isopensilent:1

# Workspace 7
windowrule=appid:^.*(obsproject).*,tags:7

# Workspace 8
windowrule=appid:^.*(Nicotine)$,tags:8,isopensilent:1

# Workspace 9
windowrule=appid:com.transmissionbt*,tags:9,isopensilent:1

# Additional Tag Mappings
windowrule=appid:Nsxiv,isfloating:1,unfocused_opacity:1.0
windowrule=appid:^.*(zathura)$,unfocused_opacity:1.0
windowrule=appid:sioyek,unfocused_opacity:1.0

# ------------------------------------------------------------------------------
# GUI TAG MAPPING
# ------------------------------------------------------------------------------

windowrule=allow_csd:1,unfocused_opacity:1.0,appid:firefox
windowrule=appid:^(discord)$,unfocused_opacity:1.0,noblur:1
windowrule=appid:^(code)-.*$,unfocused_opacity:1.0,noblur:1
windowrule=appid:^(calibre).*$,unfocused_opacity:1.0,noblur:1
windowrule=appid:gcr-prompter,unfocused_opacity:1.0,noblur:1
windowrule=appid:^(Thunar).*$,unfocused_opacity:1.0,noblur:1
windowrule=appid:gimp,unfocused_opacity:1.0,noblur:1
windowrule=appid:anki,unfocused_opacity:1.0,noblur:1
windowrule=appid:^(file).*$,unfocused_opacity:1.0,noblur:1
windowrule=appid:^.*(mGBA).*$,unfocused_opacity:1.0,noblur:1
windowrule=appid:^(libreoffice)-*$,unfocused_opacity:1.0,noblur:1
windowrule=appid:electron,unfocused_opacity:1.0,noblur:1
windowrule=appid:^.*(Nicotine)$,unfocused_opacity:1.0,noblur:1
windowrule=appid:steam,unfocused_opacity:1.0,noblur:1
windowrule=appid:nwg-look,unfocused_opacity:1.0,noblur:1,isfloating:1
windowrule=appid:.*(fcitx5-config-qt)$,unfocused_opacity:1.0,noblur:1,isfloating:1
windowrule=appid:^.*(pavucontrol)$,unfocused_opacity:1.0,noblur:1,isfloating:1
windowrule=appid:xdg-desktop-portal-gtk,unfocused_opacity:1.0,noblur:1,isfloating:1
windowrule=appid:^(blue).*$,unfocused_opacity:1.0,noblur:1,isfloating:1
windowrule=appid:^([Vv]irt.*),unfocused_opacity:1.0,noblur:1
windowrule=appid:filezilla,unfocused_opacity:1.0,noblur:1
windowrule=appid:.*(KeePassXC)$,focused_opacity:1.0,unfocused_opacity:1.0
windowrule=appid:com.transmissionbt*,focused_opacity:1.0,unfocused_opacity:1.0

# ------------------------------------------------------------------------------

# FLOATING, SIZES & FOCUS BEHAVIOR
# ------------------------------------------------------------------------------

# Pinentry Focus Fix
windowrule=appid:(pinentry-)(.*),isopensilent:0

# Custom floating rule for video tag / apps
windowrule=appid:mpv,isfloating:1,width:849,height:477,no_force_center:0,noblur:1,unfocused_opacity:1.0

# No blur or animation for slurp selection layer (avoids occlusion and ghosting in screenshots)
layerrule=noanim:1,noblur:1,layer_name:selection

# Disable blur for selection tools
windowrule=noblur:1,appid:slurp

# Zoom animation for Rofi with multiple parameters
layerrule=noanim:1,layer_name:rofi

# Disable animations and shadows for notification daemon
layerrule=noanim:1,noshadow:1,layer_name:notifications

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:monocle,no_render_border:1
tagrule=id:2,layout_name:tile
tagrule=id:3,open_as_floating:1
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,open_as_floating:1
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,open_as_floating:1
